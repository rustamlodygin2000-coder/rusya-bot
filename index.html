<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Шар Судьбы Руси</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background: #0a0b10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            overflow: hidden;
        }

        /* Шапка */
        .header {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, #ff0055, #00f2ff);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #181920;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        /* Блок Шара */
        .ball-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            position: relative;
        }

        .magic-ball {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #7a00ff, #000000);
            box-shadow: inset -10px -10px 30px rgba(0,0,0,0.9),
                        0 0 50px rgba(122, 0, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .magic-ball:active {
            transform: scale(0.95);
        }

        .ball-inner {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #0d0e15;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        /* Анимация тряски */
        .shake {
            animation: shakeAnim 0.5s ease-in-out infinite;
        }

        @keyframes shakeAnim {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-8px, 5px) rotate(-5deg); }
            40% { transform: translate(8px, -5px) rotate(5deg); }
            60% { transform: translate(-5px, -2px) rotate(-3deg); }
            80% { transform: translate(5px, 2px) rotate(3deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Окно предсказания */
        .prediction-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            max-width: 320px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            color: #00f2ff;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        /* Кнопка */
        .action-btn {
            width: 100%;
            max-width: 320px;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(90deg, #7a00ff, #00f2ff);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(122, 0, 255, 0.4);
            margin-bottom: 10px;
        }

        .action-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="avatar-container">
            <div class="avatar">😎</div>
        </div>
        <div class="title" id="userName">Пацанский Оракул</div>
        <div class="subtitle">Жми на шар — узнай мудрость от Руси!</div>
    </div>

    <!-- Шар судьбы -->
    <div class="ball-container">
        <div class="magic-ball" id="magicBall">
            <div class="ball-inner" id="ballIcon">🎱</div>
        </div>
    </div>

    <!-- Блок с ответом -->
    <div class="prediction-box" id="predictionText">
        Прикоснись к шару, чтобы Руся раскидал за твой день...
    </div>

    <!-- Кнопка -->
    <button class="action-btn" id="getPredictionBtn">Узнать судьбу 🔮</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const predictions = [
            "Сегодня всё будет по красоте, даже не сомневайся! 😎",
            "Не суетись. Кто понял жизнь — тот не спешит. 🤙",
            "Сегодня фартит! Делай то, что давно задумывал. 🚀",
            "Держи ухо востро, кто-то захочет проверить тебя на прочность. 👁️",
            "Отдохни, бро. Всех денег не заработаешь, а нервы одни. ☕",
            "Сегодня день мощных движух. Впрягайся смело! 🔥",
            "Будь проще, и люди к тебе подтянутся. 🤝",
            "Главное — сохраняй спокойствие и пацанский вайб. 👑",
            "Сегодня лучше не рисковать понапрасну. Посиди ровно. 🛑",
            "Вечером жди приятный суета-новость! 🎁"
        ];

        const magicBall = document.getElementById('magicBall');
        const ballIcon = document.getElementById('ballIcon');
        const predictionText = document.getElementById('predictionText');
        const btn = document.getElementById('getPredictionBtn');

        function askOracle() {
            if (magicBall.classList.contains('shake')) return;

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('heavy');
            }

            magicBall.classList.add('shake');
            predictionText.innerText = "Руся думает...";
            ballIcon.innerText = "🔮";

            setTimeout(() => {
                magicBall.classList.remove('shake');
                const randomText = predictions[Math.floor(Math.random() * predictions.length)];
                predictionText.innerText = `«${randomText}»`;
                ballIcon.innerText = "✨";

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');}
            }, 1000);
        }

        magicBall.addEventListener('click', askOracle);
        btn.addEventListener('click', askOracle);
    </script>
</body>
</html>
