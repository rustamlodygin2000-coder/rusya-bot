<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Руся AI Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background: #0d0e12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            overflow: hidden;
        }

        /* Шапка с аватаром */
        .header {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, #ff0055, #7a00ff);
            box-shadow: 0 0 25px rgba(122, 0, 255, 0.6);
            animation: pulse 2s infinite alternate;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #1a1b22;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(122, 0, 255, 0.4); }
            100% { box-shadow: 0 0 30px rgba(255, 0, 85, 0.8); }
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            margin-top: 12px;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #fff, #b5b5b5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 6px;
            color: #ff0055;
            font-weight: 600;
            border: 1px solid rgba(255, 0, 85, 0.3);
        }

        /* Блок баланса */
        .balance-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px 30px;
            width: 90%;
            max-width: 320px;
            margin: 15px 0;
        }

        .balance-label {
            font-size: 13px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-value {
            font-size: 32px;
            font-weight: 900;
            color: #00ff88;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            margin-top: 4px;
        }

        /* Игровое поле / Монета */
        .game-area {
            display: flex;flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .tap-button {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #7a00ff 0%, #3b0080 100%);
            border: 4px solid #a855ff;
            box-shadow: 0 0 40px rgba(122, 0, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .tap-button:active {
            transform: scale(0.92);
            box-shadow: 0 0 60px rgba(255, 0, 85, 0.9);
        }

        .tap-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }

        /* Всплывающие цифры при клике */
        .plus-one {
            position: absolute;
            font-size: 28px;
            font-weight: 900;
            color: #00ff88;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }

        /* Нижняя кнопка */
        .footer-btn {
            width: 100%;
            max-width: 320px;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(90deg, #ff0055, #7a00ff);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 0, 85, 0.4);
            margin-bottom: 10px;
        }

        .footer-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="avatar-container">
            <!-- Аватарка Руси -->
            <img src="https://i.ibb.co/6y3S6qS/rusya-avatar.jpg" alt="Руся AI" class="avatar" id="avatarImg">
        </div>
        <div class="title" id="userName">Пацан Руси</div>
        <div class="badge">🔥 РУСЯ AI MINI APP</div>
    </div>

    <!-- Баланс -->
    <div class="balance-card">
        <div class="balance-label">Твой Авторитет</div>
        <div class="balance-value" id="balance">100 🎰</div>
    </div>

    <!-- Игровая зона (Кликер) -->
    <div class="game-area">
        <div class="tap-button" id="tapBtn">😎</div>
        <div class="tap-hint">Жми на Русика — фарми Респекты!</div>
    </div>

    <!-- Кнопка закрытия/сохранения -->
    <button class="footer-btn" id="claimBtn">Забрать в Бота 🚀</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        let balance = 100;

        // Получаем имя юзера из Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name || "Пацан";
        }

        const balanceEl = document.getElementById('balance');
        const tapBtn = document.getElementById('tapBtn');
        const claimBtn = document.getElementById('claimBtn');

        // Обработка Тапа
        tapBtn.addEventListener('click', (e) => {
            balance += 1;
            balanceEl.innerText = balance + " 🎰";

            // Вибрация телефона при клике!
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            // Анимация +1
            createPlusOne(e.clientX, e.clientY);
        });

        function createPlusOne(x, y) {
            const el = document.createElement('div');
            el.className = 'plus-one';
            el.innerText = '+1';
            el.style.left = (x - 15) + 'px';
            el.style.top = (y - 30) + 'px';
            document.body.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 800);
        }

        // Кнопка сохранения
        claimBtn.addEventListener('click', () => {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
            tg.sendData(JSON.stringify({ new_balance: balance }));
            tg.close();
        });
    </script>
</body>
</html>
